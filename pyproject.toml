[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleus-patch-utility-2026"
version = "0.1.0"
description = "A Python-based utility for managing and testing Roblox client patches. Developed for QA engineers and developers to streamline patch validation workflows. It includes a feature for automated script ex"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sam-plab03c2" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
nucleus_patch_utility_2026 = "nucleus_patch_utility_2026.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
